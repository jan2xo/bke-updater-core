[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bke-updater-core"
version = "0.1.0"
description = "Product-agnostic verified update transactions for the BKE ecosystem"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
